resolver 127.0.0.11 valid=10s ipv6=off;
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    server_name dev.ia-luma.com.br;
    set $api dev-api:8080;
    set $web dev-web:3000;
    client_max_body_size 20m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    location = /deployment { alias /status/dev.json; default_type application/json; add_header Cache-Control "no-store"; }
    location = /health { proxy_pass http://$api; }
    location ^~ /webhooks/ { proxy_pass http://$api; proxy_read_timeout 90s; }
    location / { proxy_pass http://$web; proxy_read_timeout 90s; }
}
server {
    listen 80;
    server_name ia-luma.com.br www.ia-luma.com.br;
    set $api production-api:8080;
    set $web production-web:3000;
    client_max_body_size 20m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    location = /deployment { alias /status/production.json; default_type application/json; add_header Cache-Control "no-store"; }
    location = /health { proxy_pass http://$api; }
    location ^~ /webhooks/ { proxy_pass http://$api; proxy_read_timeout 90s; }
    location / { proxy_pass http://$web; proxy_read_timeout 90s; }
}
server {
    listen 80;
    server_name api.ia-luma.com.br;
    set $api production-api:8080;
    client_max_body_size 20m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    location ^~ /admin { return 404; }
    location ^~ /dev { return 404; }
    location / { proxy_pass http://$api; proxy_read_timeout 90s; }
}
