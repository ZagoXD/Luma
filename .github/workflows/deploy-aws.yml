name: Deploy AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de destino
        required: true
        type: choice
        options: [dev, production]
        default: dev
      sha:
        description: Commit completo; produção deve corresponder ao dev validado
        type: string
        required: false
      stage_only:
        description: Preparar canal sem validar execução (AWS pausada; não liga instâncias)
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: aws-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'dev' }}
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_ENV: ${{ inputs.environment || 'dev' }}
      REQUESTED_SHA: ${{ inputs.sha }}
      CI_SHA: ${{ github.event.workflow_run.head_sha }}
      STAGE_ONLY: ${{ inputs.stage_only || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select and validate commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" = production ]; then
            if [ "$STAGE_ONLY" = true ]; then
              test -n "$REQUESTED_SHA"
              mkdir /tmp/luma-dev-channel
              gh release download aws-channel-dev --dir /tmp/luma-dev-channel --pattern 'manifest.*'
              openssl pkeyutl -verify -pubin -inkey infra/aws/keys/dev.pem -rawin -in /tmp/luma-dev-channel/manifest.json -sigfile /tmp/luma-dev-channel/manifest.sig
              python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "infra/aws")
          from deploy import validate_manifest
          data = json.load(open("/tmp/luma-dev-channel/manifest.json"))
          validate_manifest(data, "dev")
          PY
              cp /tmp/luma-dev-channel/manifest.json /tmp/dev.json
            else
              curl --fail --retry 3 "https://dev.ia-luma.com.br/deployment?run=$GITHUB_RUN_ID" -o /tmp/dev.json
            fi
            SHA=$(jq -r .sha /tmp/dev.json)
            if [ -n "$REQUESTED_SHA" ] && [ "$SHA" != "$REQUESTED_SHA" ]; then
              echo 'Production must promote the currently validated dev commit.' >&2
              exit 1
            fi
          else
            SHA=${REQUESTED_SHA:-${CI_SHA:-$GITHUB_SHA}}
          fi
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$SHA" origin/main
          if [ "$STAGE_ONLY" = true ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=100" | jq -e '.workflow_runs | any(.status == "completed" and .conclusion == "success")' > /dev/null
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          git checkout --detach "$SHA"
      - name: Prepare immutable images
        env:
          SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir out
          if gh release view "aws-$SHA" >/dev/null 2>&1; then
            gh release download "aws-$SHA" --dir out --pattern '*.tar.gz'
          else
            test "$TARGET_ENV" = dev
            docker build --label "org.opencontainers.image.revision=$SHA" -t "luma-api:$SHA" -f whatsapp-app/src/Luma.Api/Dockerfile whatsapp-app
            docker build --label "org.opencontainers.image.revision=$SHA" -t "luma-web:$SHA" web
            docker save "luma-api:$SHA" | gzip -1 > out/api.tar.gz
            docker save "luma-web:$SHA" | gzip -1 > out/web.tar.gz
            gh release create "aws-$SHA" out/api.tar.gz out/web.tar.gz --target "$SHA" --prerelease --title "AWS images $SHA" --notes 'Immutable tested deployment images. No credentials included.'
          fi
      - name: Sign deployment channel
        env:
          SHA: ${{ steps.release.outputs.sha }}
          SIGNING_KEY: ${{ secrets.DEPLOY_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          umask 077
          printf '%s\n' "$SIGNING_KEY" > /tmp/luma-signing.pem
          trap 'rm -f /tmp/luma-signing.pem' EXIT
          python3 infra/aws/release.py "$SHA" "$TARGET_ENV"
          if [ "$STAGE_ONLY" = true ] && [ "$TARGET_ENV" = production ]; then
            python3 - <<'PY'
          import json
          staged = json.load(open("out/manifest.json"))
          dev = json.load(open("/tmp/luma-dev-channel/manifest.json"))
          if staged["sha"] != dev["sha"] or staged["assets"] != dev["assets"]:
              raise ValueError("Production artifacts differ from the signed dev channel")
          PY
          fi
          openssl pkeyutl -sign -rawin -inkey /tmp/luma-signing.pem -in out/manifest.json -out out/manifest.sig
          if ! gh release view "aws-channel-$TARGET_ENV" >/dev/null 2>&1; then
            gh release create "aws-channel-$TARGET_ENV" --target "$SHA" --prerelease --title "AWS $TARGET_ENV channel" --notes 'Signed deployment pointer; signature and archive hashes are verified by the host.'
          fi
          gh release upload "aws-channel-$TARGET_ENV" out/manifest.sig out/manifest.json --clobber
      - name: Verify deployed revision and health
        if: inputs.stage_only != true
        env:
          SHA: ${{ steps.release.outputs.sha }}
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HEALTH_URL"
          python3 infra/aws/health.py "$HEALTH_URL" "$SHA" "$TARGET_ENV"
          echo "### $TARGET_ENV deployed: $SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Report pending installation
        if: inputs.stage_only == true
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          echo "### $TARGET_ENV staged: $SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Signed channel published; not installed or health-validated. No AWS instances were started. The host updater installs it after startup.' >> "$GITHUB_STEP_SUMMARY"
