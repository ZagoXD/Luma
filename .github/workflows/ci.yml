name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Deployment safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s infra/aws -p 'test_*.py'

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: luma_integration
          POSTGRES_USER: luma
          POSTGRES_PASSWORD: luma-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luma -d luma_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: whatsapp-app

    env:
      ASPNETCORE_ENVIRONMENT: Testing
      LUMA_INTEGRATION_DATABASE: Host=localhost;Port=5432;Database=luma_integration;Username=luma;Password=luma-ci-only
      Luma__JwtSigningKey: luma-ci-jwt-signing-key-with-enough-length-for-tests
      Luma__RequireActiveSubscription: "false"
      Luma__StoreMessageBodies: "false"
      OpenAI__ApiKey: ci-placeholder
      OpenAI__Model: gpt-5.4-mini
      OpenAI__ImageModel: gpt-image-1
      Privacy__EncryptionEnabled: "true"
      Privacy__EncryptionKey: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      Privacy__LookupPepper: HyAdHBsaGRgXFhUUExIREA8ODQwLCgkIBwYFBAMCAQA=
      Privacy__ActiveKeyId: ci
      Twilio__AccountSid: AC00000000000000000000000000000000
      Twilio__AuthToken: ci-placeholder
      Twilio__WhatsAppFrom: whatsapp:+16204008668

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore Luma.sln

      - name: Test backend
        run: dotnet test Luma.sln --configuration Release --no-restore

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5050
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_LUMA_WHATSAPP_NUMBER: "+16204008668"
      LUMA_API_BASE_URL: http://localhost:5050
      LUMA_COOKIE_SECURE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test frontend SEO policy
        run: npm test

      - name: Test waitlist data protection
        run: node --test ../infra/waitlist/worker.test.mjs

      - name: Build frontend
        run: npm run build

      - name: Verify standalone SEO in production and dev modes
        run: node scripts/check-seo.mjs --local

      - name: Build isolated Cloudflare Pages waitlist
        run: node ../infra/waitlist/build.cjs
