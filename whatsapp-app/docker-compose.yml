services:
  postgres:
    image: postgres:16-alpine
    container_name: luma-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luma}
      POSTGRES_USER: ${POSTGRES_USER:-luma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-luma_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - luma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luma -d luma"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: luma-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - luma_redis_data:/data

  api:
    build:
      context: .
      dockerfile: src/Luma.Api/Dockerfile
    container_name: luma-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-luma};Username=${POSTGRES_USER:-luma};Password=${POSTGRES_PASSWORD:-luma_dev_password}
      Luma__StoreMessageBodies: ${LUMA_STORE_MESSAGE_BODIES:-false}
      Luma__RequireActiveSubscription: ${LUMA_REQUIRE_ACTIVE_SUBSCRIPTION:-true}
      Luma__JwtSigningKey: ${LUMA_JWT_SIGNING_KEY:-luma-dev-jwt-signing-key-change-me-please}
      Luma__WebBaseUrl: ${LUMA_WEB_BASE_URL:-http://localhost:3000}
      Luma__RateLimit__WindowSeconds: ${LUMA_RATE_LIMIT_WINDOW_SECONDS:-30}
      Luma__RateLimit__MaxMessages: ${LUMA_RATE_LIMIT_MAX_MESSAGES:-5}
      Luma__RateLimit__CooldownSeconds: ${LUMA_RATE_LIMIT_COOLDOWN_SECONDS:-60}
      Luma__MessageLockSeconds: ${LUMA_MESSAGE_LOCK_SECONDS:-25}
      Luma__DeduplicationSeconds: ${LUMA_DEDUPLICATION_SECONDS:-300}
      Redis__ConnectionString: ${REDIS_CONNECTION_STRING:-redis:6379}
      Notifications__WorkerEnabled: ${NOTIFICATIONS_WORKER_ENABLED:-false}
      Notifications__WorkerIntervalSeconds: ${NOTIFICATIONS_WORKER_INTERVAL_SECONDS:-60}
      Twilio__AccountSid: ${TWILIO_ACCOUNT_SID:-}
      Twilio__AuthToken: ${TWILIO_AUTH_TOKEN:-}
      Twilio__WhatsAppFrom: ${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
      Twilio__TemplatePeriodTomorrow: ${TWILIO_TEMPLATE_PERIOD_TOMORROW:-}
      Twilio__TemplatePeriodToday: ${TWILIO_TEMPLATE_PERIOD_TODAY:-}
      Twilio__TemplateContraceptiveDaily: ${TWILIO_TEMPLATE_CONTRACEPTIVE_DAILY:-}
      Twilio__TemplateSymptomCheckin: ${TWILIO_TEMPLATE_SYMPTOM_CHECKIN:-}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__PublishableKey: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      Stripe__BasicPriceId: ${STRIPE_BASIC_PRICE_ID:-}
      Stripe__EssentialPriceId: ${STRIPE_ESSENTIAL_PRICE_ID:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__BaseUrl: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OpenAI__Model: ${OPENAI_MODEL:-gpt-5.4-mini}
      OpenAI__ImageModel: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      OpenAI__TimeoutSeconds: ${OPENAI_TIMEOUT_SECONDS:-12}
      OpenAI__MaxOutputTokens: ${OPENAI_MAX_OUTPUT_TOKENS:-700}
      OpenAI__ReasoningEffort: ${OPENAI_REASONING_EFFORT:-none}
      ElevenLabs__ApiKey: ${ELEVENLABS_API_KEY:-}
      ElevenLabs__BaseUrl: ${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io/v1}
      ElevenLabs__SpeechToTextModel: ${ELEVENLABS_SPEECH_TO_TEXT_MODEL:-scribe_v2}
      ElevenLabs__LanguageCode: ${ELEVENLABS_LANGUAGE_CODE:-pt}
      ElevenLabs__TimeoutSeconds: ${ELEVENLABS_TIMEOUT_SECONDS:-30}
      ElevenLabs__MaxAudioBytes: ${ELEVENLABS_MAX_AUDIO_BYTES:-10485760}
      R2__AccountId: ${R2_ACCOUNT_ID:-52ed8799dba98c8a90611db618a89e3e}
      R2__BucketName: ${R2_BUCKET_NAME:-luma}
      R2__AccessKeyId: ${R2_ACCESS_KEY_ID:-}
      R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:-}
      R2__Endpoint: ${R2_ENDPOINT:-https://52ed8799dba98c8a90611db618a89e3e.r2.cloudflarestorage.com}
      R2__PublicBaseUrl: ${R2_PUBLIC_BASE_URL:-https://pub-7621f98d02d741da84d6fd1b054da6d5.r2.dev}
      R2__BabyImagePrefix: ${R2_BABY_IMAGE_PREFIX:-baby-image-generation}
      R2__ImageRetentionDays: ${R2_IMAGE_RETENTION_DAYS:-1}
      R2__ImageGenerationTimeoutSeconds: ${R2_IMAGE_GENERATION_TIMEOUT_SECONDS:-60}
    ports:
      - "${API_HOST_PORT:-5050}:8080"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5050}
        NEXT_PUBLIC_LUMA_WHATSAPP_NUMBER: ${NEXT_PUBLIC_LUMA_WHATSAPP_NUMBER:-+14155238886}
    container_name: luma-web
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5050}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_LUMA_WHATSAPP_NUMBER: ${NEXT_PUBLIC_LUMA_WHATSAPP_NUMBER:-+14155238886}
      LUMA_API_BASE_URL: ${LUMA_API_BASE_URL:-http://api:8080}
      LUMA_COOKIE_SECURE: ${LUMA_COOKIE_SECURE:-false}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"

volumes:
  luma_postgres_data:
  luma_redis_data:
